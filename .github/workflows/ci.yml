# Compatibility tests and a credential-free rehearsal of GitLab verification.
name: CI - Run tests

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to run the workflow on (e.g. dev)'
        required: false
        default: 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run internal tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24', '26']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 'Debug: show Node & npm versions'
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Check deployment security policy
        run: node scripts/ci/check-deployment.js

      - name: Run tests
        run: npm run test:internal --silent
        env:
          CI: true

  rehearsal:
    name: GitLab rehearsal (${{ matrix.job }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        job: [internal, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install launcher dependencies
        run: npm ci --ignore-scripts

      - name: Rehearse GitLab verification
        run: node scripts/ci/rehearse-gitlab.js "${{ matrix.job }}"

      - name: Save rehearsal logs and rendered deployment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitlab-rehearsal-${{ matrix.job }}
          path: tmp/preflight/${{ matrix.job }}/
          if-no-files-found: error
          retention-days: 14

  preflight:
    name: Deployment preflight
    runs-on: ubuntu-latest
    needs: [test, rehearsal]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$REHEARSAL_RESULT" = success
