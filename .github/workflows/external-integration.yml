# Live provider smoke tests. These checks are intentionally separate from the
# required deterministic CI checks so provider outages remain visible without
# blocking merges when the repository ruleset leaves them non-required.
name: External integration smoke tests

permissions:
  contents: read

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  schedule:
    # GitHub evaluates this in Europe/London, keeping the run at 09:00 local.
    - cron: '0 9 * * 1-5'
      timezone: 'Europe/London'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: External smoke - ${{ matrix.dependency }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dependency: ENA taxonomy
            script: test:external:ena
          - dependency: identifiers.org
            script: test:external:identifiers
          - dependency: OLS
            script: test:external:ols
          - dependency: GitHub FEGA schema
            script: test:external:github

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.dependency }} smoke test
        run: npm run ${{ matrix.script }} --silent
