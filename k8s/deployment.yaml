apiVersion: apps/v1
kind: Deployment
metadata:
  name: biovalidator
  namespace: biovalidator-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: biovalidator
  template:
    metadata:
      labels:
        app: biovalidator
    spec:
      # Do not inject legacy Service-link variables such as
      # BIOVALIDATOR_PORT=tcp://<cluster-ip>:80 into the container.
      # enableServiceLinks: false
      containers:
        - name: biovalidator
          image: "dockerhub.ebi.ac.uk/ega/biovalidator:main"
          resources:
            limits:
              cpu: "1000m"
              memory: "2000Mi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          imagePullPolicy: Always
          env:
            - name: BIOVALIDATOR_PORT
              value: "3020"
            - name: BIOVALIDATOR_BASE_URL
              value: "/biovalidator"
          ports:
            - name: http
              containerPort: 3020
          readinessProbe:
            httpGet:
              path: /biovalidator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /biovalidator/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      nodeSelector:
        subnet: internal
      imagePullSecrets:
        - name: regcredebi
