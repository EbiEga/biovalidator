apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biovalidator
  namespace: biovalidator-dev
  
spec:
ingressClassName: nginx
  rules:
    - host: dev.ega.ebi.ac.uk
      http:
        paths:
          - path: /biovalidator
            pathType: Prefix
            backend:
              service:
                name: biovalidator
                port:
                  number: 80
