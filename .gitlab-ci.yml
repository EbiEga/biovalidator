include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build-containers

variables:
  # Also used by the GitHub rehearsal and rendered-manifest validation.
  CI_NODE_IMAGE: node:26.12.1-bookworm-slim@sha256:28147155d47dc31abe0a46e0d12b59b2fb3d0a2dcc5dc65fce76a074180b16fe

internal-tests:
  stage: test
  image: $CI_NODE_IMAGE
  script:
    - sh scripts/ci/check-internal.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: false

docker-build:
  stage: build-containers
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  services:
    - name: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - sh scripts/ci/wait-docker.sh
  script:
    - sh scripts/ci/verify-image.sh
    - sh scripts/ci/publish-image.sh

  artifacts:
    paths:
      - deployment-immutable.yaml

  after_script:
    - docker logout dockerhub.ebi.ac.uk || true

  rules:
    # Publish the default branch only after successful earlier stages:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

    # For all other branches, run only when explicitly asked:
    - when: manual
