include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build-containers

variables:
  # Also used by the GitHub rehearsal and rendered-manifest validation.
  CI_NODE_IMAGE: node:26.7.0-bookworm-slim@sha256:4db36457f406501e6f608802e5da617e5fbd0e80b75901b6a09de1ae5a667d32

internal-tests:
  stage: test
  image: $CI_NODE_IMAGE
  script:
    - sh scripts/ci/check-internal.sh
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: false

docker-build:
  stage: build-containers
  image: docker:24.0.9-cli@sha256:2b62f89aaab9e4df0ff843f0d9a7bbd17340a9ba7c660ba6f40b1f00b38c2a4d
  services:
    - name: docker:24.0.9-dind@sha256:9b17a9f25adf17b88d0a013b4f00160754adf4b07ccbe9986664a49886c2c98e
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - sh scripts/ci/wait-docker.sh
  script:
    - sh scripts/ci/verify-image.sh
    - sh scripts/ci/publish-image.sh

  artifacts:
    paths:
      - deployment-immutable.yaml

  after_script:
    - docker logout dockerhub.ebi.ac.uk || true

  rules:
    # Publish the default branch only after successful earlier stages:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success

    # For all other branches, run only when explicitly asked:
    - when: manual
