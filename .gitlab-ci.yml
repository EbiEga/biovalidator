include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build-containers

node-test:
  stage: test
  image: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

docker-build:
  stage: build-containers
  image: docker:24.0.9-cli
  services:
    - name: docker:24.0.9-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs:
    - job: node-test
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - IMMUTABLE_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    - REF_TAG="$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker build --pull --build-arg REVISION="$CI_COMMIT_SHA" --tag "$IMMUTABLE_TAG" --tag "$REF_TAG" .
    - docker push "$IMMUTABLE_TAG"
    - docker push "$REF_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        LATEST_TAG="$CI_REGISTRY_IMAGE:latest"
        docker tag "$IMMUTABLE_TAG" "$LATEST_TAG"
        docker push "$LATEST_TAG"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" || true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true
    - when: never
