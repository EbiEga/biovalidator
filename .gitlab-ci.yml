include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build-containers

node-test:
  stage: test
  image: node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3
  services: []
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends git
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

docker-build:
  stage: build-containers
  image: docker:24.0.9-cli
  services:
    - name: docker:24.0.9-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["node-test"]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login dockerhub.ebi.ac.uk -u "$CI_REGISTRY_USER" --password-stdin

    - IMAGE="$CI_REGISTRY_IMAGE"
    - BRANCH="$CI_COMMIT_REF_SLUG"
    - SHA="$CI_COMMIT_SHORT_SHA"

    - TAG_IMMUTABLE="${BRANCH}-${SHA}"
    - TAG_BRANCH="${BRANCH}"

    - echo "Building tags:"
    - echo "$IMAGE:$TAG_IMMUTABLE"
    - echo "$IMAGE:$TAG_BRANCH"

    - docker build --build-arg REVISION="$CI_COMMIT_SHA" -t "$IMAGE:$TAG_IMMUTABLE" -t "$IMAGE:$TAG_BRANCH" .

    # Add the global :latest tag only for the default branch (main):
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$TAG_IMMUTABLE" "$IMAGE:latest"
      fi

    - docker push --all-tags $IMAGE

  rules:
    # Run always for the default branch (main):
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

    # For all other branches, run only when explicitly asked:
    - when: manual
