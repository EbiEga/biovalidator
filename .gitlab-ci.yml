include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - test
  - build-containers

docker-build:
  stage: build-containers
  image: docker:24.0.9-cli
  services:
    - name: docker:24.0.9-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  before_script:
    - |
      attempt=0
      until docker info >/dev/null 2>&1; do
        attempt=$((attempt + 1))
        if [ "$attempt" -ge 30 ]; then
          echo "Docker daemon did not become ready"
          docker info
          exit 1
        fi
        sleep 1
      done
  script:
    - IMAGE="$CI_REGISTRY_IMAGE"
    - BRANCH="$CI_COMMIT_REF_SLUG"
    - SHA="$CI_COMMIT_SHORT_SHA"

    - TAG_IMMUTABLE="${BRANCH}-${SHA}"
    - TAG_BRANCH="${BRANCH}"

    - echo "Building tags:"
    - echo "$IMAGE:$TAG_IMMUTABLE"
    - echo "$IMAGE:$TAG_BRANCH"

    - IMAGE_TAG="$IMAGE:$TAG_IMMUTABLE" ADDITIONAL_IMAGE_TAG="$IMAGE:$TAG_BRANCH" REVISION="$CI_COMMIT_SHA" sh scripts/ci/check-container.sh
    - echo "$CI_REGISTRY_PASSWORD" | docker login dockerhub.ebi.ac.uk -u "$CI_REGISTRY_USER" --password-stdin
    - docker push "$IMAGE:$TAG_IMMUTABLE"
    - docker push "$IMAGE:$TAG_BRANCH"

    # Add the global :latest tag only for the default branch (main):
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$TAG_IMMUTABLE" "$IMAGE:latest"
        docker push "$IMAGE:latest"
      fi

  after_script:
    - docker logout dockerhub.ebi.ac.uk || true

  rules:
    # Run always for the default branch (main):
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

    # For all other branches, run only when explicitly asked:
    - when: manual
